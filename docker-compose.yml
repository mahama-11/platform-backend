services:
  prod-backend:
    image: ver/v-platform-backend:${PROD_TAG:-1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: v-platform-backend
    ports:
      - "8095:8095"
    environment:
      PLATFORM_CONFIG_FILE: config.prod
      PLATFORM_PORT: 8095
    networks:
      - shared-network
    volumes:
      - ./config.prod.yaml:/app/config.prod.yaml:ro
      - /data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8095/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s

  dev-backend:
    image: ver/v-platform-backend:${DEV_TAG:-dev}
    container_name: v-platform-backend-dev
    restart: unless-stopped
    ports:
      - "8195:8195"
    environment:
      PLATFORM_CONFIG_FILE: config.dev
      PLATFORM_PORT: 8195
    networks:
      - shared-network
    volumes:
      - ./config.dev.yaml:/app/config.dev.yaml:ro
      - /data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8195/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  shared-network:
    external: true
