database:
  driver: postgres
  host: kong-database
  port: 5432
  user: kong
  password: kongpassword
  dbname: kong
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  auto_migrate_enabled: true
  log_level: "warn"
  slow_threshold: "1s"
  parameterized_logs: true

redis:
  enabled: true
  host: kyc-redis
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5
  max_retries: 3
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

security:
  jwt_secret: platform-dev-secret
  jwt_expiration: 24h
  max_body_bytes: 16777216
  provider_upload_max_bytes: 134217728
  rate_limit_per_second: 100
  rate_limit_burst: 200
  kong_shared_secret: platform-kong-shared-secret
  internal_service_secret: platform-internal-secret
  encryption_key: platform-encryption-key-change-me

oauth:
  google:
    client_id: ""
    client_secret: ""
    redirect_url: ""
    frontend_return_url: ""

monitoring:
  metrics:
    enabled: true
    port: 9091
    path: "/metrics"
    namespace: "platform"
    subsystem: "service"
    push_interval: "30s"
    histogram_buckets: [0.1, 0.5, 1, 2, 5, 10]
  tracing:
    enabled: true
    backend: "tempo"
    service_name: "platform-service"
    service_version: "1.0.0"
    environment: "development"
    jaeger_endpoint: "http://localhost:14268/api/traces"
    otlp_endpoint: "enterprise-otel-collector:4317"
    otlp_insecure: true
    sample_rate: 1.0
    log_spans: false

runtime:
  worker_enabled: true
  poll_initial_backoff: 2s
  poll_backoff: 5s
  poll_timeout: 5m

volcengine:
  api_key: "ark-2e5e5fa9-82f1-4ab4-be28-e47c6ecd12ee-e8dfe"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  image_model: "doubao-seedream-4-5-251128"
  image_size: "2K"
  output_format: "png"
  watermark: false

minimax:
  base_url: "https://api.minimaxi.com/v1"
  api_key: "change-me-in-config"
  model: "MiniMax-M2.7"
  request_timeout: 60s
  max_tokens: 2048
  temperature: 0.2

minimax_image:
  enabled: true
  base_url: "https://api.minimaxi.com/v1"
  api_key: ""
  model: "image-01"
  request_timeout: 120s
  default_aspect_ratio: "1:1"

kimi_coding:
  base_url: "https://api.kimi.com/coding"
  api_key: "change-me-in-config"
  model: "kimi-k2.6"
  request_timeout: 90s
  max_tokens: 4096
  temperature: 0.2

gemini_visual:
  enabled: true
  base_url: "https://xingjiabiapi.org"
  api_key: ""
  model: "gemini-3-flash-preview"
  request_timeout: 60s
  max_tokens: 2500
  temperature: 0

gemini_image:
  enabled: true
  base_url: "https://xingjiabiapi.org"
  api_key: ""
  model: "gemini-3-pro-image-preview"
  request_timeout: 90s
  max_tokens: 1500
  temperature: 0

comfyui_bridge:
  enabled: true
  base_url: "https://agent-menu.com/api/comfyui/"
  api_key: ""
  request_timeout: 60s
  callback_base_url: "http://127.0.0.1:8195"
  default_workflow_id: ""
  default_output_format: "png"

pai_video:
  enabled: true
  base_url: "https://app-api.pixverseai.cn/openapi/v2"
  api_key: ""
  api_key_file: "/run/secrets/pai_video_api_key"
  default_model: "v6"
  request_timeout: 60s
