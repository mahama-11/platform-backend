        metadata: '{"objective_scores":{"quality":90,"speed":60,"cost":55},"fallback_on":["retryable_provider","provider_timeout","provider_unavailable"],"input_modes":["single_image"],"output_mime_types":["application/json"],"frontend_selectable":true}'
